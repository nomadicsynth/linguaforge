# Project and run
project_name: neon-420
run_name: tiny-test

# Dataset
dataset_config: sample-10BT
dataset_name_or_path: HuggingFaceFW/fineweb-edu
dataset_packing: true
dataset_size_eval: 5000
dataset_size_train: 0
dataset_train_split_name: train
num_train_epochs: 1

# Model size
hidden_size: 768
intermediate_size: 2112
num_attention_heads: 32
num_key_value_heads: 2
num_hidden_layers: 42

# Context and batch
context_length: 16384
per_device_eval_batch_size: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 1

# Logging, Saving and Evaluation
logging_steps: 10
logging_strategy: steps
include_num_input_tokens_seen: true
save_steps: 0.125
# eval_steps: 0.125
eval_strategy: 'no'
eval_on_start: false
wandb: false

template_model_name: nomadicsynth/neon-360-0.1
tie_word_embeddings: true
warmup_steps: 100
liger_kernel: true
optimizer: adamw_bnb_8bit
flash_attn: true
gradient_checkpointing: false
num_cpus: 5
